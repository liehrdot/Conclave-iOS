# SonarQube Cloud analysis (workflow .github/workflows/sonarcloud.yml). The organization and project key are the
# ones SonarQube Cloud picked when the repository was added.
sonar.organization=liehrdot
sonar.projectKey=liehrdot_Conclave-iOS
sonar.projectName=Conclave-iOS

sonar.sources=App,Packages/ConclaveCore/Sources
sonar.tests=Packages/ConclaveCore/Tests
sonar.exclusions=**/*.xcassets/**

# Coverage of the core package, measured on Linux and converted by scripts/lcov_to_sonar.py. The screens
# have no unit tests (they are checked with UI tests and screenshots), so they stay out of the coverage condition.
sonar.coverageReportPaths=coverage.xml
sonar.coverage.exclusions=App/**
