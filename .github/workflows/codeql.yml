# CodeQL code scanning: GitHub's fixed security queries over the Swift code and the workflows. Swift needs a
# real build to analyse, so its job runs on a Mac with the same steps as CI; the workflows need none.
# Findings show under Security › Code scanning. This is CodeQL's "advanced setup": the repository's
# "default setup" must stay off, or the two clash.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Pinned on purpose, not "the newest": CodeQL cannot read Swift built with Xcode 27 (GitHub, 2026-10-19),
# and Xcode 27 brings iOS 27's new Liquid Glass to the app. Moving to it is a decision, made here, in all workflows.
env:
  XCODE: "26.6"

permissions:
  contents: read
  security-events: write

jobs:
  # what did this pull request touch? The Swift scan takes 15 to 20 Mac minutes, so on a pull request it only runs
  # when there is Swift to scan, and the workflow scan only when a workflow changed. Pushes to main, the weekly
  # run and runs started by hand always scan both. A skipped job counts as passed for the required checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
      actions: ${{ steps.diff.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # a base git can't compare against counts as changed
        run: |
          changed() { if git diff --quiet "$BASE" HEAD -- "$@"; then echo false; else echo true; fi; }
          echo "swift=$(changed App Packages project.yml .github/codeql .github/workflows/codeql.yml)" >> "$GITHUB_OUTPUT"
          echo "actions=$(changed .github)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  swift:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Xcode ${{ env.XCODE }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended
      - name: Build
        run: >
          xcodebuild build
          -project Conclave.xcodeproj -scheme Conclave -configuration Debug
          -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift

  actions:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions
