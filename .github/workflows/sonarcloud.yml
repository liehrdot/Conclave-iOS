# SonarQube Cloud: bugs, code smells, duplication and coverage of the Swift code, with SonarQube Cloud's
# quality gate on new code. Free for public repositories. Settings live in sonar-project.properties; the
# token is the repository secret SONAR_TOKEN (also a Dependabot secret, because Dependabot runs get no
# repository secrets). Automatic Analysis can't read Swift, so this CI analysis is the only one.
# The job fails when the quality gate fails, so the main ruleset can require the check `sonarqube`.
name: SonarQube Cloud

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # blame data for "new code"
      # the same path inside the container as outside, so the coverage report's file paths match
      - name: Core tests with coverage
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD/Packages/ConclaveCore" swift:6.2-noble sh -c '
            swift test --enable-code-coverage &&
            llvm-cov export -format=lcov .build/debug/ConclaveCorePackageTests.xctest \
              -instr-profile .build/debug/codecov/default.profdata \
              -ignore-filename-regex="(\.build|Tests)/" > coverage.lcov'
          python3 scripts/lcov_to_sonar.py Packages/ConclaveCore/coverage.lcov > coverage.xml
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # Claude's security review (check `claude`) costs tokens, so it waits for the quality gate. When that is
  # not green the job still runs, but fails at once without calling Claude: a required check that is
  # skipped would count as passed. Re-running the failed jobs after a fix runs both again.
  claude:
    needs: sonarqube
    if: ${{ always() && github.event_name != 'push' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the quality gate
        if: needs.sonarqube.result != 'success'
        run: |
          echo "::error::The SonarQube quality gate is not green (${{ needs.sonarqube.result }}), so the security review did not run. Fix that first."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      # The action's API check (used only by its false-positive filter) still calls the retired
      # claude-3-5-haiku-20241022; the 404 turns that filter off. Point it at a current model in the pinned copy.
      # Fails when the line is gone, so an action update without the bug gets noticed and this step removed.
      - name: Fix retired model in the action
        run: |
          f="${{ runner.workspace }}/../_actions/anthropics/claude-code-security-review/0c6a49f1fa56a1d472575da86a94dbc1edb78eda/claudecode/claude_api_client.py"
          grep -q 'claude-3-5-haiku-20241022' "$f"
          sed -i 's/claude-3-5-haiku-20241022/claude-haiku-5-5/' "$f"
      - name: Review
        id: review
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-02-11
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-sonnet-5-5
          run-every-commit: true
          custom-security-scan-instructions: ${{ github.workspace }}/.github/security-review.txt
      - name: Verdict
        env:
          RESULTS: ${{ github.workspace }}/claudecode-results.json
        run: |
          if [ ! -s "$RESULTS" ]; then echo "::error::The security review produced no result."; exit 1; fi
          if jq -e '.error' "$RESULTS" >/dev/null; then echo "::error::The security review failed: $(jq -r '.error' "$RESULTS")"; exit 1; fi
          n=$(jq '.findings // [] | length' "$RESULTS")
          if [ "$n" -gt 0 ]; then
            jq -r '.findings[] | "::error file=\(.file // ""),line=\(.line // 1)::\(.severity // "?"): \(.description // .title // "finding")"' "$RESULTS" || true
            echo "::error::$n security finding(s). Fix them, or merge with the admin bypass if they are false positives."
            exit 1
          fi
          echo "No security findings."
