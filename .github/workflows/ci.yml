name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pinned on purpose, not "the newest": CodeQL cannot read Swift built with Xcode 27 (GitHub, 2026-10-19),
# and Xcode 27 brings iOS 27's new Liquid Glass to the app. Moving to it is a decision, made here, in all workflows.
env:
  XCODE: "26.6"

permissions:
  contents: read

jobs:
  # ConclaveCore has no UI, so its tests run on Linux: fast, and they run on every push
  tests:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --package-path Packages/ConclaveCore

  # the app itself needs a Mac: GitHub's runner is ours
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Xcode ${{ env.XCODE }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      # unsigned: iloader (docs/sideload.md) signs it with your own Apple ID when it installs it
      - name: Build
        run: >
          xcodebuild build
          -project Conclave.xcodeproj -scheme Conclave -configuration Release
          -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      # an .ipa is only a zip with the app in a Payload folder
      - name: Pack the .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Conclave.app Payload/
          zip -qr Conclave.ipa Payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conclave-ios
          path: Conclave.ipa
          retention-days: 14

  # how the screens look, light and dark, iPhone and iPad: the PR's "Artifacts" hold the pictures
  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Xcode ${{ env.XCODE }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      # the simulator runs unsigned apps, so no signing here either
      - name: Build for the simulator
        run: >
          xcodebuild build
          -project Conclave.xcodeproj -scheme Conclave -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
      - run: scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/Conclave.app screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots
          retention-days: 14

  # the app icon as iOS draws it, in every appearance, and on the Home Screen: the "icon" artifact
  icon:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Xcode ${{ env.XCODE }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for the simulator
        run: >
          xcodebuild build
          -project Conclave.xcodeproj -scheme Conclave -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
      - run: scripts/icon.sh build/Build/Products/Debug-iphonesimulator/Conclave.app icon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon
          path: icon
          retention-days: 14
